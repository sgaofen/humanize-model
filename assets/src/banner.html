<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>humanizer · banner</title>
<link rel="stylesheet" href="base.css">
<script>addEventListener("error",e=>window.__err=e.message);addEventListener("unhandledrejection",e=>window.__err=String(e.reason))</script>
<style>
  main { position: relative; width: 1280px; height: 420px; overflow: hidden; }
  .wave { position: absolute; left: -40px; bottom: 26px; width: 1360px; height: 210px; color: var(--lime); opacity: .10; }
  .wave svg { width: 100%; height: 100%; }
  .grid { position: relative; display: grid; grid-template-columns: 600px 1fr; gap: 56px; padding: 62px 64px 0 72px; height: 100%; }
  .logo { display: flex; align-items: center; gap: 18px; }
  .logo .sq { width: 64px; height: 64px; border-radius: 16px; background: var(--sheet-2); border: 1px solid var(--line); display: grid; place-items: center; color: var(--lime); }
  .logo .sq svg { width: 40px; height: 24px; }
  .logo b { font-family: var(--f-display); font-weight: 700; font-size: 66px; letter-spacing: -.028em; line-height: 1; font-variation-settings: "opsz" 96; }
  h1 { margin: 34px 0 0; font-family: var(--f-ui); font-weight: 600; font-size: 31px; line-height: 1.22; letter-spacing: -.015em; max-width: 560px; }
  :root[lang="zh-CN"] h1 { font-size: 32px; letter-spacing: 0; font-weight: 600; line-height: 1.35; }
  h1 .hl { background: var(--lime); color: var(--lime-ink); padding: 0 .16em; margin: 0 -.04em; border-radius: .2em .08em .24em .1em; -webkit-box-decoration-break: clone; }
  .sub { margin: 14px 0 0; color: var(--ink-2); font-size: 19px; line-height: 1.45; max-width: 540px; }
  .meta { position: absolute; left: 72px; bottom: 44px; display: flex; gap: 10px; }
  .meta span { font-family: var(--f-mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); border: 1px solid var(--line); background: rgba(18,20,24,.85); border-radius: 999px; padding: 6px 12px 5px; }
  .demo { display: flex; flex-direction: column; gap: 14px; padding-top: 8px; }
  .card { padding: 16px 20px 18px; }
  .card .h { display: flex; justify-content: space-between; margin-bottom: 8px; }
  .card .h .eyebrow { font-size: 10.5px; }
  .card .t { font-size: 17px; line-height: 1.6; color: var(--ink); }
  :root[lang="zh-CN"] .card .t { font-size: 17px; line-height: 1.75; }
  .card.d .t { color: var(--ink-2); }
  .arrow { display: flex; align-items: center; gap: 10px; margin: -2px 0 -2px 20px; color: var(--ink-3); font-family: var(--f-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
  .arrow i { width: 30px; height: 30px; border-radius: 50%; background: var(--lime); display: grid; place-items: center; color: var(--lime-ink); }
  .arrow i svg { width: 16px; height: 16px; }
  .k { font-family: var(--f-mono); font-size: 10.5px; color: var(--ink-3); letter-spacing: .04em; }
</style>
</head>
<body>
<main id="m"></main>
<script type="module">
import { tokenize, diffTokens, renderMarked } from '../../app/web/js/diff.js';
import { lang, markSvg, MARK_PATH, done } from './common.js';
const zh = lang === 'zh';

// 右侧示例取自评测集真实样例(与对比卡同源):英文 email_work_00_luna、中文 zh_zhihu_08_sonnet 各一句。
const ex = zh ? {
  a: '以前这套流程雷打不动要花我6-7个小时,现在压缩到40分钟以内。',
  b: '之前全流程下来固定6-7个小时，现在优化后控制在40分钟以内。',
} : {
  a: 'The deadline is Friday, March 14. Please prioritize the files marked “High” in the tracker, especially MB-2047, MB-2091, and MB-2110, since those are scheduled for management review first.',
  b: 'The cutoff is Friday, March 14. Please focus on the "High" items in the tracker, particularly MB-2047, MB-2091 and MB-2110, as these will be reviewed by management first.',
};
const T = zh ? {
  h1: '把 AI 写的草稿，改成<span class="hl">像人写的</span>。',
  sub: '训练目标：数字、单位、日期、人名、引语一个不丢，也不往里加东西。',
  meta: ['12B', '本地运行', '中文 + English', 'Apache 2.0'],
  d: '01 · 草稿 · AI 写的', r: '02 · 改写 · humanizer', go: '改写', src: '评测集真实样例',
} : {
  h1: 'Rewrites AI drafts so they <span class="hl">read like a person</span> wrote them.',
  sub: 'Trained to keep every number, unit, date, name and quote, and to add nothing.',
  meta: ['12B', 'runs locally', 'English + 中文', 'Apache 2.0'],
  d: '01 · Draft · by an AI', r: '02 · Rewrite · humanizer', go: 'rewrite', src: 'real eval sample',
};
// 背景里放大的标志线:直线 → 手写波浪
const big = `<svg viewBox="0 0 40 24" preserveAspectRatio="none"><path d="${MARK_PATH}" fill="none" stroke="currentColor" stroke-width=".55" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" style="stroke-width:6px"/></svg>`;
const arrow = '<svg viewBox="0 0 24 24"><path d="M12 4v14M5.5 12.5 12 19l6.5-6.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
document.getElementById('m').innerHTML = `
  <div class="wave">${big}</div>
  <div class="grid">
    <div>
      <div class="logo"><span class="sq">${markSvg(3.2)}</span><b>humanizer</b></div>
      <h1>${T.h1}</h1>
      <p class="sub">${T.sub}</p>
    </div>
    <div class="demo">
      <div class="card sheet d"><div class="h"><span class="eyebrow">${T.d}</span><span class="k">${T.src}</span></div><div class="t" id="a"></div></div>
      <div class="arrow"><i>${arrow}</i>${T.go}</div>
      <div class="card sheet"><div class="h"><span class="eyebrow">${T.r}</span><span class="k">12B</span></div><div class="t" id="b"></div></div>
    </div>
  </div>
  <div class="meta">${T.meta.map((x) => `<span>${x}</span>`).join('')}</div>`;
const ta = tokenize(ex.a), tb = tokenize(ex.b), d = diffTokens(ta, tb);
renderMarked(document.getElementById('a'), ta, d.a, 'del');
renderMarked(document.getElementById('b'), tb, d.b, 'ins');
await done();
</script>
</body>
</html>
